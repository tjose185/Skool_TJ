<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charger Maintenance Route</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #map {
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 6px;
        }

        h3 {
            margin: 0 0 8px;
        }

        p {
            margin: 0;
        }
    </style>
</head>

<body>
    <div id='map'></div>
    <div id='info'>
        <h3>EV Charger Maintenance Route</h3>
        <p id='result'>Finding an efficient route...</p>
    </div>
    <script>
        const map = L.map('map').setView([52.52, 13.405], 12);
        L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.{ext}', {
            minZoom: 0,
            maxZoom: 20,
            attribution: '...',
            ext: 'png'
        }).addTo(map);

        const stops = [
            [13.4050, 52.5200],
            [13.3870, 52.5293], [13.4126, 52.5210], [13.4327, 52.5105],
            [13.4031, 52.5017], [13.3695, 52.5031], [13.3427, 52.5108],
            [13.3338, 52.5245], [13.3558, 52.5392], [13.3858, 52.5482],
            [13.4184, 52.5427], [13.4462, 52.5314], [13.4600, 52.5158],
            [13.4432, 52.4920], [13.3902, 52.4878], [13.3653, 52.5186]
        ];

        const coordinates = stops.map(p => p.join(',')).join(';');

        async function showRoute() {
            try {
                const response = await fetch(
                    'https://router.project-osrm.org/trip/v1/driving/' + coordinates +
                    '?roundtrip=true&source=first&overview=full&geometries=geojson'
                );
                console.log("received response")
                console.log(response)
                if (!response.ok) throw Error('Routing request failed');
                const data = await response.json();
                console.log("data =", data)
                if (data.code !== 'Ok') throw Error(data.code);
                const route = data.trips[0];
                const line = L.geoJSON(route.geometry, {
                    style: { color: '#17b6c7', weight: 5 }
                }).addTo(map);
                data.waypoints.forEach((stop, index) => {
                    const [lon, lat] = stop.location;
                    const number = stop.waypoint_index;
                    L.marker([lat, lon])
                        .bindPopup(index === 0 ? 'Depot: start and finish' :
                            'Stop ' + number + ': EV charger ' + index)
                        .bindTooltip(index === 0 ? 'D' : String(number), {
                            permanent: true, direction: 'top'
                        }).addTo(map);
                });
                const mark = L.marker([52.5210,13.50])
                mark.bindPopup("<b>Custom Standalone Marker</b><br>Independent of route tracking sequence.").addTo(map);
                mark.bindTooltip("New Marker", {permanent: true, direction: 'top' }).addTo(map);
                const group = L.featureGroup([line, mark]);
                map.fitBounds(group.getBounds(), {
                    padding: [30, 30]
                });
                // map.fitBounds(line.getBounds());


                document.getElementById('result').textContent =
                    (stops.length - 1) + ' stops · ' + (route.distance / 1000).toFixed(1) + ' km · ' +
                    Math.round(route.duration / 60) + ' min driving';

            }
            catch (error) {
                document.getElementById('result').textContent = 'Could not load route';
                console.error(error);
            }
        }

        showRoute();

    </script>
</body>

</html>
