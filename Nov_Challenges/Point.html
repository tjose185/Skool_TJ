<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EARTHQUAKES - Past 7 Days</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="map"></div>
    <h2>EARTHQUAKES - Past 7 Days</h2>
    <script>
        const map = L.map('map').setView([15, 0], 2);
        L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner_dark/{z}/{x}/{y}{r}.{ext}', {
            minZoom: 0,
            maxZoom: 20,
            attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://www.stamen.com/" target="_blank">Stamen Design</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            ext: 'png'
        }).addTo(map);
        fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: (feature, latlng) => {
                        const mag = feature.properties.mag;
                        let color = '#17b6c7';
                        if (mag >= 6) color = '#f2ee4b';
                        else if (mag >= 5) color = '#b4ff4a';
                        else if (mag >= 4) color = '#46e0a4';
                        else if (mag >= 3) color = '#26d6c5';
                        return L.circleMarker(latlng, {
                            radius: 6,
                            color: color,
                            weight: 1,
                            fillColor: color,
                            fillOpacity: 0.7
                        });
                    }
                }).addTo(map);
            })
            .catch(error =>
                console.error('Could not load earthquakes:', error)); 
    </script>

</body>

</html>
